  <script>
    // 画像・iframeの遅延読み込み（Intersection Observer）
    document.addEventListener('DOMContentLoaded', function () {
      // WebP遅延画像（lazy-img）
      var lazyImgs = document.querySelectorAll('img.lazy-img');
      var imgObserver = new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var img = entry.target;
            img.src = img.dataset.src;
            img.classList.remove('lazy-img');
            obs.unobserve(img);
          }
        });
      }, { rootMargin: '200px' }); // 200px手前から読み込み開始
      lazyImgs.forEach(function (img) { imgObserver.observe(img); });

      // YouTube iframe遅延読み込み
      var lazyIframes = document.querySelectorAll('iframe.lazy-iframe');
      var iframeObserver = new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            var iframe = entry.target;
            iframe.src = iframe.dataset.src;
            iframe.classList.remove('lazy-iframe');
            obs.unobserve(iframe);
          }
        });
      }, { rootMargin: '300px' }); // 300px手前から読み込み開始
      lazyIframes.forEach(function (iframe) { iframeObserver.observe(iframe); });
    });
  </script>
